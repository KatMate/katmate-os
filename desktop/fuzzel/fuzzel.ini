# fuzzel: the launcher and menus of desktop/bin/km-menu.
# Colours are style-cybrbar.css's: @no1 background, @re0 text and selection,
# @no0 selected text, @gr0 match, @re1 border; the bar's font.

[main]
font=GeistMono Nerd Font:size=11
icons-enabled=no
anchor=top-left
width=40
lines=12
horizontal-pad=16
vertical-pad=8
inner-pad=6
layer=overlay

[colors]
background=05070dff
text=2dd4bfff
prompt=2dd4bfff
placeholder=898d99ff
input=2dd4bfff
match=30f291ff
selection=2dd4bfff
selection-text=030408ff
selection-match=030408ff
counter=898d99ff
border=0f766eff

[border]
width=1
radius=0
