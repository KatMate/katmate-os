# fuzzel: the launcher and menus of desktop/bin/km-menu.
# Colours are style-cybrbar.css's: @no1 background, @re0 text and selection,
# @no0 selected text, @gr0 match, @re1 border; the bar's font. The background
# alone is 30% transparent (operator, fz1); text and selection are opaque.

[main]
font=GeistMono Nerd Font:size=11
icons-enabled=no
anchor=center
width=40
lines=12
horizontal-pad=16
vertical-pad=8
inner-pad=6
layer=overlay
# With fuzzel's default (yes), the power menu opened by a click on the bar
# closed as soon as the pointer left the button (fz1, MINIS; sway runs with
# focus_follows_mouse yes).
exit-on-keyboard-focus-loss=no

[colors]
background=05070db3
text=2dd4bfff
prompt=2dd4bfff
placeholder=898d99ff
input=2dd4bfff
match=30f291ff
selection=2dd4bfff
selection-text=030408ff
selection-match=030408ff
counter=898d99ff
border=0f766eff

[border]
width=1
radius=0
