# netVM routes the internal segment out through the uplink, NATed (ADR-037 R2)
# — enable IPv4 forwarding.
net.ipv4.ip_forward = 1

# Reverse-path filtering: KatMate's adoption of the vendor values (ADR-037 R51,
# R57). These three lines are systemd's 50-default.conf, stated here verbatim
# so the value is KatMate's decision and not inherited silently (ADR-036 § 3
# rule 2): loose (2) on `default` and on every interface by the glob, and
# `all` excluded from the glob, so it stays at the kernel default 0.
# `all = 0` is deliberately NOT written: how systemd-sysctl orders an explicit
# key against a glob is unverified (R57). The post-rebuild reading is the check.
#
# This is a loose second defence, not the binding. The binding of each peer
# address to its slot is the nft chain slot_guard in /etc/nftables.conf
# (R47-R50). A per-kmkk key cannot work here in any case: systemd-sysctl runs
# before the slot links are renamed (open problem #33).
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.*.rp_filter = 2
-net.ipv4.conf.all.rp_filter
