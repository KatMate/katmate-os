# ctnetlink, loaded at boot (ADR-037's note of 2026-09-30, R115).
# netvm-agent's NETCFG REMOVE ends with one conntrack delete by mark over
# NETLINK_NETFILTER (R107). The kernel would probably autoload this module on
# that first request, but a REMOVE whose flush meets a missing subsystem
# returns ERR and keeps its record; loud and at boot is preferred. Kconfig
# CONFIG_NF_CT_NETLINK=m in netVM's kernel (s4c-m0). build/netvm.sh reads
# this file and the module back.
nf_conntrack_netlink
