# netVM dnsmasq configuration (ADR-037 R5, R17, R18). Replaces the packaged
# /etc/dnsmasq.conf, which is comments only.
#
# DNS for the AppVMs on the slots, and nothing else: no DHCP (no dhcp-range),
# no router advertisements (no enable-ra), no D-Bus interface (no enable-dbus;
# dnsmasq(8): --enable-dbus is opt-in). build/netvm.sh refuses an image whose
# dnsmasq configuration carries any of those, or bind-interfaces/bind-dynamic.
#
# DEFAULT WILDCARD MODE, deliberately: neither bind-interfaces nor
# bind-dynamic (R17). netVM's slot address 10.100.1.1 does not exist at boot;
# NETCFG adds it per slot at ADD, as a /32 with a peer, on several slots at once,
# and removes it at REMOVE. In the default mode dnsmasq binds the wildcard
# address and filters each query by the interface it arrived on (dnsmasq(8),
# --bind-interfaces), so it needs no address to be present when it starts.
#
# Answers only on the slots, never on the uplink. dnsmasq(8): "Dnsmasq
# automatically adds the loopback (local) interface to the list of interfaces
# to use when the --interface option is used"; loopback is taken out again by
# DNSMASQ_EXCEPT="lo" in /etc/default/dnsmasq (ruling R29), which the packaged
# unit's helper turns into -I lo.
interface=km*
except-interface=uplink0

# Upstream: /etc/resolv.conf, dnsmasq's default, written by dhcpcd from the
# uplink lease and polled for changes (R6, R18). That file never names a
# loopback address, so dnsmasq cannot forward to itself.
