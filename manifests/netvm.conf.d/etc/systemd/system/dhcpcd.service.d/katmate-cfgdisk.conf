# dhcpcd reads the configuration katmate-cfgdisk.service writes to /run
# (ADR-037 R38): the baked /etc/dhcpcd.conf as it is, plus a static uplink0
# block when the config disk carries one. The baked file is never rewritten.
#
# Requires=: a consumer that fails, whether on an unknown VERSION, an unknown
# member or a non-canonical uplink, means no dhcpcd and no uplink (R36).
[Unit]
Requires=katmate-cfgdisk.service
After=katmate-cfgdisk.service

# The packaged command, dhcpcd 1:10.1.0-11+deb13u4 (read from the Debian
# package, ADR-037's note on R41–R44 and the two readings), plus -f. Only
# ExecStart= changes. The packaged sandbox stands as shipped:
# ProtectSystem=strict leaves /run readable, and dhcpcd only reads this file.
# ExecStop= stays the packaged `dhcpcd -x`, which signals the running daemon.
# Without -f it loads the baked /etc/dhcpcd.conf, which is valid on its own.
# That this is harmless at stop is expected, and has not been observed.
[Service]
ExecStart=
ExecStart=/usr/sbin/dhcpcd -q -b -f /run/katmate-cfg/dhcpcd.conf
