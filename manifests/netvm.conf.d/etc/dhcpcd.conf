# netVM dhcpcd configuration (ADR-037 R6, R14). dhcpcd holds the uplink's DHCP
# lease and writes /etc/resolv.conf, which dnsmasq reads as its upstream (R5,
# R18). systemd-networkd is disabled in netVM (R15).
#
# Below the rule is Debian's packaged /etc/dhcpcd.conf (dhcpcd-base
# 1:10.1.0-11+deb13u4), verbatim. This file replaces that conffile in the image,
# so the package default is carried here rather than lost. KatMate's own lines
# are the block at the END, and they narrow what is above.
# ------------------------------------------------------------------------------
# A sample configuration for dhcpcd.
# See dhcpcd.conf(5) for details.

# Allow users of this group to interact with dhcpcd via the control socket.
#controlgroup wheel

# Inform the DHCP server of our hostname for DDNS.
hostname

# Use the hardware address of the interface for the Client ID.
#clientid
# or
# Use the same DUID + IAID as set in DHCPv6 for DHCPv4 ClientID as per RFC4361.
# Some non-RFC compliant DHCP servers do not reply with this set.
# In this case, comment out duid and enable clientid above.
duid

# Persist interface configuration when dhcpcd exits.
persistent

# vendorclassid is set to blank to avoid sending the default of
# dhcpcd-<version>:<os>:<machine>:<platform>
vendorclassid

# A list of options to request from the DHCP server.
option domain_name_servers, domain_name, domain_search
option classless_static_routes
# Respect the network MTU. This is applied to DHCP routes.
option interface_mtu

# Request a hostname from the network
option host_name

# Most distributions have NTP support.
option ntp_servers

# A ServerID is required by RFC2131.
require dhcp_server_identifier

# Generate SLAAC address using the Hardware Address of the interface
#slaac hwaddr
# OR generate Stable Private IPv6 Addresses based from the DUID
slaac private

# ------------------------------------------------------------------------------
# KatMate netVM (ADR-037 R14).
#
# The uplink only. dhcpcd.service starts `dhcpcd -q -b` with no interface, which
# is Manager mode: it "discovers available Ethernet interfaces that can be
# configured" (dhcpcd(8)), the sixteen slots km00..km0f included, and an address, route or lease on a slot
# that NETCFG did not program is a second source of the one truth ADR-025
# Path B keeps: the slots are programmed by the agent over rtnetlink and by
# nothing else. `uplink0` is the guest-side name 60-katmate-uplink.link gives
# the NIC at guest PCI 0000:00:04.0.
allowinterfaces uplink0

# No IPv4 link-local (169.254/16) fallback when no lease arrives.
noipv4ll

# Vanilla egress is IPv4 only; IPv6 egress needs its own ADR. dhcpcd.conf(5):
# "Only configure IPv4." Whether that also silences router solicitation on the
# uplink is not stated there and has not been observed.
ipv4only
