#!/usr/sbin/nft -f
# Katmate OS — netVM firewall / routing policy (ADR-021).
#
# STATIC and appVM-AGNOSTIC. The internal segment is matched only as the
# aggregate 10.100.1.0/24, never per-appVM: per-/32 isolation is provided by
# TOPOLOGY (each appVM is a separate p2p link with a link-scoped /32 route
# delivered via the agent's NETCFG), not by per-appVM firewall rules. This file
# therefore never changes as appVMs come and go.
#
# Corrected from the running netinst pet, which carried netinst drift:
#   - input allowed 10.100.17.0/24 — WRONG subnet; the segment is 10.100.1.0/24
#     (netVM .1, personalVM .2). The old rule matched nothing.
#   - forward referenced "enx00e04c3961b8" — the HOST USB-NIC MAC-name, an
#     interface that does not exist in netVM. Those rules were dead, and
#     forwarding the raw LAN uplink into the VPN is not netVM's job anyway.
#
# netVM's forwarding role: internal segment <-> proton (VPN). The uplink carries
# the tunnel itself; it is not a forward source.
#
# NOTE: the internal interface name is intentionally NOT pinned here. Per-appVM
# p2p links are created at launch; if a fixed internal interface name is adopted
# for the internal side, tighten the forward rules to oifname/iifname it. Until
# then, forwarding is scoped by the proton interface + established,related.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        ct state established,related accept
        iif lo accept

        # internal segment (appVMs, personalVM) -> netVM
        ip saddr 10.100.1.0/24 accept

        # WireGuard handshake.
        # AUDIT (ADR-021): 51820 is the LOCAL listen port. If the ProtonVPN
        # tunnel is CLIENT-only, inbound 51820 may be unnecessary —
        # established,related already covers handshake replies. Kept to match
        # the pet until audited against the actual wg config.
        udp dport 51820 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        ct state established,related accept

        # internal segment  ->  VPN
        ip saddr 10.100.1.0/24 oifname "proton" accept
        # VPN  ->  internal segment
        iifname "proton" ip daddr 10.100.1.0/24 accept

        # No uplink<->proton forwarding: the raw LAN uplink is not a forward
        # source, it only carries the tunnel. (The dead enx00e04c3961b8 rules
        # are removed; do not reinstate them for the uplink interface.)
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname "proton" masquerade
    }
}
