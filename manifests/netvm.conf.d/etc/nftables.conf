#!/usr/sbin/nft -f
# Katmate OS — netVM firewall / routing policy (ADR-021).
#
# STATIC and appVM-AGNOSTIC. The internal segment is matched only as the
# aggregate 10.100.1.0/24, never per-appVM: per-/32 isolation is provided by
# TOPOLOGY (each appVM is a separate p2p link with a link-scoped /32 route
# delivered via the agent's NETCFG), not by per-appVM firewall rules. This file
# therefore never changes as appVMs come and go.
#
# Corrected from the running netinst pet, which carried netinst drift:
#   - input allowed 10.100.17.0/24 — WRONG subnet; the segment is 10.100.1.0/24
#     (netVM .1, personalVM .2). The old rule matched nothing.
#   - forward referenced "enx00e04c3961b8" — the HOST USB-NIC MAC-name, an
#     interface that does not exist in netVM. Those rules were dead, and
#     forwarding the raw LAN uplink into the VPN is not netVM's job anyway.
#
# netVM's forwarding role, vanilla (ADR-037 R2): internal segment -> the uplink,
# direct, NATed. No VPN. `uplink0` is the guest-side name 60-katmate-uplink.link
# gives the passed-through NIC (R3). A post-install VPN, and the ruleset mode
# with its kill-switch, is designed at networking-arc step 3 (R20); nothing in
# this file anticipates it.
#
# Return traffic is admitted ONLY by `ct state established,related` (R19). There
# is no explicit uplink -> segment rule: on a raw LAN one would admit unsolicited
# inbound to any routed pool peer.
#
# The slot links are named km00..km0f (ADR-035). The policy rules below match
# the segment by source address, not by interface; what binds each source to
# its slot is the chain slot_guard, jumped as rule 1 of input and of forward.
# It is the IPv4 half of finding 12 (R21; ADR-037 R47-R50), gated by F12a and
# F12b (ADR-035's note of 2026-09-28). It does not see ARP: that half is open
# problem #34, and it is `table arp filter` at the end of this file (R100).

flush ruleset

table inet filter {

    # The finding-12 slot guard (ADR-037 R47-R50). ADR-035 §§ 2, 4, 8: slot k
    # is named kmkk and its peer is 10.100.1.(16+k); every slot carries the
    # same 10.100.1.1/32, so the interface is the only discriminator the pool
    # has. The sixteen pairs are that arithmetic written out (R48), and
    # build/netvm.sh reads them back from the baked file.
    #
    # `return` means "this packet is who it claims to be"; the caller then
    # applies its own policy. A packet that matches nothing here also returns.
    #
    # ORDER IS LOAD-BEARING: the jump sits ABOVE `ct state established,related`
    # in both chains. A forged packet that matches an existing conntrack tuple
    # would otherwise be accepted before any source check saw it.
    #
    # The failure mode is loud, deliberately. `iifname` is a per-packet string
    # comparison, so this file loads whether or not the slot interfaces exist
    # or were renamed. If the rename does not fire, no pair returns, and every
    # slot's traffic is dropped and counted: a control that goes inert when its
    # precondition fails is worse than one that stops the traffic.
    #
    # No logging: guest kernel log lines reach the host journal through the
    # serial console at a rate the guest chooses. The counters give the same
    # visibility through `nft list chain inet filter slot_guard`.
    chain slot_guard {
        iifname "km00" ip saddr 10.100.1.16 return
        iifname "km01" ip saddr 10.100.1.17 return
        iifname "km02" ip saddr 10.100.1.18 return
        iifname "km03" ip saddr 10.100.1.19 return
        iifname "km04" ip saddr 10.100.1.20 return
        iifname "km05" ip saddr 10.100.1.21 return
        iifname "km06" ip saddr 10.100.1.22 return
        iifname "km07" ip saddr 10.100.1.23 return
        iifname "km08" ip saddr 10.100.1.24 return
        iifname "km09" ip saddr 10.100.1.25 return
        iifname "km0a" ip saddr 10.100.1.26 return
        iifname "km0b" ip saddr 10.100.1.27 return
        iifname "km0c" ip saddr 10.100.1.28 return
        iifname "km0d" ip saddr 10.100.1.29 return
        iifname "km0e" ip saddr 10.100.1.30 return
        iifname "km0f" ip saddr 10.100.1.31 return

        # R49: the internal segment is IPv4-only. R22's absent icmpv6 accept
        # is a second guard behind this one on the slots.
        iifname { "km00", "km01", "km02", "km03", "km04", "km05", "km06", "km07",
                  "km08", "km09", "km0a", "km0b", "km0c", "km0d", "km0e", "km0f" } meta nfproto ipv6 counter drop comment "IPv6 on a slot interface (R49)"

        # R50: any segment source that did not return above, on any interface
        # but lo (netVM's own traffic to 10.100.1.1 arrives there): a pool
        # source on the wrong slot, 10.100.1.1 or another segment address
        # forged on a slot, or a segment source arriving on uplink0.
        iifname != "lo" ip saddr 10.100.1.0/24 counter drop comment "segment source off its slot (R50)"

        # Anything else left on a slot is an off-segment source. Each slot is
        # a private point-to-point link, so nothing legitimate arrives here.
        iifname { "km00", "km01", "km02", "km03", "km04", "km05", "km06", "km07",
                  "km08", "km09", "km0a", "km0b", "km0c", "km0d", "km0e", "km0f" } counter drop comment "off-segment source on a slot interface"
    }

    # Conntrack marks by slot (ADR-035 §6; R107, R116). Every new flow that
    # arrives on slot k is marked k+1 (mark 0 stays "unmarked"), so NETCFG
    # REMOVE can flush exactly that slot's entries with one ctnetlink delete
    # by mark. The criterion is the ORIGINAL source's slot: under masquerade a
    # forwarded flow's reply destination is the uplink address, not the peer.
    # Prerouting, not forward, so a slot's flows to netVM itself (dnsmasq,
    # R5) are marked and flushed too (R116). Marking decides nothing: the
    # policy is still input's and forward's, and slot_guard still runs first
    # there. build/netvm.sh reads the sixteen pairs back from the baked file.
    chain slot_mark {
        type filter hook prerouting priority filter;
        policy accept;

        iifname "km00" ct state new ct mark set 1
        iifname "km01" ct state new ct mark set 2
        iifname "km02" ct state new ct mark set 3
        iifname "km03" ct state new ct mark set 4
        iifname "km04" ct state new ct mark set 5
        iifname "km05" ct state new ct mark set 6
        iifname "km06" ct state new ct mark set 7
        iifname "km07" ct state new ct mark set 8
        iifname "km08" ct state new ct mark set 9
        iifname "km09" ct state new ct mark set 10
        iifname "km0a" ct state new ct mark set 11
        iifname "km0b" ct state new ct mark set 12
        iifname "km0c" ct state new ct mark set 13
        iifname "km0d" ct state new ct mark set 14
        iifname "km0e" ct state new ct mark set 15
        iifname "km0f" ct state new ct mark set 16
    }

    chain input {
        type filter hook input priority 0;
        policy drop;

        jump slot_guard

        ct state established,related accept
        iif lo accept

        # internal segment (appVMs, personalVM) -> netVM; this is also what
        # admits AppVM DNS to dnsmasq (ADR-037 R5)
        ip saddr 10.100.1.0/24 accept

        # No ICMPv6 accept, deliberately (R22). With policy drop this drops
        # every inbound ICMPv6, router advertisements arriving on the slots
        # included, and that absence is what keeps netVM from taking an RA from
        # an AppVM while accept_ra is set (open problem #24). Adding an icmpv6
        # accept here opens #24; settle #24 first.
        #
        # No udp dport 51820 (R19): vanilla netVM runs no WireGuard tunnel, and
        # the rule was open on every interface, the uplink included.
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        jump slot_guard

        ct state established,related accept

        # internal segment  ->  uplink (vanilla egress, R2)
        ip saddr 10.100.1.0/24 oifname "uplink0" accept

        # Nothing else is forwarded: no uplink -> segment rule (return traffic
        # is established,related above, R19), and nothing from the LAN. (The
        # dead enx00e04c3961b8 rules are removed; do not reinstate them.)
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname "uplink0" masquerade
    }
}

# The ARP half of finding 12 (open problem #34; ADR-035 R100). table inet does
# not see ARP, so without this an AppVM can plant a neighbour entry in netVM
# for another slot's peer (measured: 10.100.1.17 dev km02, ADR-035's note of
# 2026-09-12, finding 6) and black-hole or intercept that peer's return
# traffic. The same sixteen pairs as slot_guard, with the address taken from
# the ARP header: slot k may claim only 10.100.1.(16+k), and any other ARP
# arriving on a slot is dropped and counted. The sender MAC is not pinned: the
# AppVM side's MAC is its instance identity, not a pool constant.
#
# Like slot_guard it binds no device (iifname is a per-packet string
# comparison), so it loads before the slot renames, as the boot order requires
# (nftables.service finishes before the first kmkk exists). It sits below the
# file's `flush ruleset`, which clears every family, so a reload replaces it
# instead of adding a second copy. build/netvm.sh reads the pairs back.
table arp filter {
    chain slot_arp {
        type filter hook input priority filter;
        policy accept;

        iifname "km00" arp saddr ip 10.100.1.16 accept
        iifname "km01" arp saddr ip 10.100.1.17 accept
        iifname "km02" arp saddr ip 10.100.1.18 accept
        iifname "km03" arp saddr ip 10.100.1.19 accept
        iifname "km04" arp saddr ip 10.100.1.20 accept
        iifname "km05" arp saddr ip 10.100.1.21 accept
        iifname "km06" arp saddr ip 10.100.1.22 accept
        iifname "km07" arp saddr ip 10.100.1.23 accept
        iifname "km08" arp saddr ip 10.100.1.24 accept
        iifname "km09" arp saddr ip 10.100.1.25 accept
        iifname "km0a" arp saddr ip 10.100.1.26 accept
        iifname "km0b" arp saddr ip 10.100.1.27 accept
        iifname "km0c" arp saddr ip 10.100.1.28 accept
        iifname "km0d" arp saddr ip 10.100.1.29 accept
        iifname "km0e" arp saddr ip 10.100.1.30 accept
        iifname "km0f" arp saddr ip 10.100.1.31 accept

        iifname "km*" counter drop comment "ARP on a slot claiming another address (R100)"
    }
}
