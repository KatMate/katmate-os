#!/usr/sbin/nft -f
# Katmate OS — netVM firewall / routing policy (ADR-021).
#
# STATIC and appVM-AGNOSTIC. The internal segment is matched only as the
# aggregate 10.100.1.0/24, never per-appVM: per-/32 isolation is provided by
# TOPOLOGY (each appVM is a separate p2p link with a link-scoped /32 route
# delivered via the agent's NETCFG), not by per-appVM firewall rules. This file
# therefore never changes as appVMs come and go.
#
# Corrected from the running netinst pet, which carried netinst drift:
#   - input allowed 10.100.17.0/24 — WRONG subnet; the segment is 10.100.1.0/24
#     (netVM .1, personalVM .2). The old rule matched nothing.
#   - forward referenced "enx00e04c3961b8" — the HOST USB-NIC MAC-name, an
#     interface that does not exist in netVM. Those rules were dead, and
#     forwarding the raw LAN uplink into the VPN is not netVM's job anyway.
#
# netVM's forwarding role, vanilla (ADR-037 R2): internal segment -> the uplink,
# direct, NATed. No VPN. `uplink0` is the guest-side name 60-katmate-uplink.link
# gives the passed-through NIC (R3). A post-install VPN, and the ruleset mode
# with its kill-switch, is designed at networking-arc step 3 (R20); nothing in
# this file anticipates it.
#
# Return traffic is admitted ONLY by `ct state established,related` (R19). There
# is no explicit uplink -> segment rule: on a raw LAN one would admit unsolicited
# inbound to any routed pool peer.
#
# The slot links are named km00..km0f (ADR-035), but the forward rule matches
# the segment by source address, not by interface, and so does input. The
# per-slot guard of finding 12 is NOT in this ruleset; it lands before arc
# step 4, as its own step with its own gate (R21).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        ct state established,related accept
        iif lo accept

        # internal segment (appVMs, personalVM) -> netVM; this is also what
        # admits AppVM DNS to dnsmasq (ADR-037 R5)
        ip saddr 10.100.1.0/24 accept

        # No ICMPv6 accept, deliberately (R22). With policy drop this drops
        # every inbound ICMPv6, router advertisements arriving on the slots
        # included, and that absence is what keeps netVM from taking an RA from
        # an AppVM while accept_ra is set (open problem #24). Adding an icmpv6
        # accept here opens #24; settle #24 first.
        #
        # No udp dport 51820 (R19): vanilla netVM runs no WireGuard tunnel, and
        # the rule was open on every interface, the uplink included.
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        ct state established,related accept

        # internal segment  ->  uplink (vanilla egress, R2)
        ip saddr 10.100.1.0/24 oifname "uplink0" accept

        # Nothing else is forwarded: no uplink -> segment rule (return traffic
        # is established,related above, R19), and nothing from the LAN. (The
        # dead enx00e04c3961b8 rules are removed; do not reinstate them.)
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname "uplink0" masquerade
    }
}
