# KatMate guest: dark GTK3 (operator ruling 3, 2026-10-04; ruling D1).
# Baked into the foundation by build/foundation.sh step 7a, so every app layer
# inherits it. GTK3 reads this file through XDG_CONFIG_DIRS (default
# /etc/xdg) and lets a user's ~/.config/gtk-3.0/settings.ini override it.
# Adwaita and its dark variant are built into libgtk-3, so no theme package
# is needed. Applies to pcmanfm, firefox-esr (believed: it follows GTK's
# prefer-dark) and LibreOffice through libreoffice-gtk3.
[Settings]
gtk-application-prefer-dark-theme=1
