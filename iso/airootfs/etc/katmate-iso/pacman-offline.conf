# pacstrap's config on the install medium (install.sh, Pacstrap). The repository
# is the medium's own: build/iso.sh downloads the host's package set with its
# full dependency closure, and keeps the core and extra databases that closure
# was resolved against. The databases carry every package's signature; the
# packages are verified against the live keyring (pacman-init.service).

[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = file:///usr/share/katmate-iso/repo

[extra]
Server = file:///usr/share/katmate-iso/repo
